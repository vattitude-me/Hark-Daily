<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c121e"/>
      <stop offset="55%" stop-color="#141c2c"/>
      <stop offset="100%" stop-color="#1a2438"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.72" r="0.45">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#f59e0b" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#d97706" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sunCore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="40%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="horizonLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0"/>
      <stop offset="30%" stop-color="#fef3c7" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#fef3c7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="arcGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.15"/>
    </linearGradient>
    <clipPath id="cardClip">
      <rect width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>
  
  <g clip-path="url(#cardClip)">
    <!-- Base background -->
    <rect width="512" height="512" fill="url(#bg)"/>
    
    <!-- Atmospheric sky glow -->
    <circle cx="256" cy="360" r="280" fill="url(#sunGlow)"/>
    
    <!-- Concentric sunrise soundwaves / arcs -->
    <path d="M 96 360 A 160 160 0 0 1 416 360" fill="none" stroke="url(#arcGrad)" stroke-width="6" stroke-linecap="round" opacity="0.4"/>
    <path d="M 136 360 A 120 120 0 0 1 376 360" fill="none" stroke="url(#arcGrad)" stroke-width="7" stroke-linecap="round" opacity="0.6"/>
    <path d="M 176 360 A 80 80 0 0 1 336 360" fill="none" stroke="url(#arcGrad)" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
    <path d="M 216 360 A 40 40 0 0 1 296 360" fill="none" stroke="#fef3c7" stroke-width="8.5" stroke-linecap="round" opacity="0.95"/>
    
    <!-- Sun core rising on horizon -->
    <circle cx="256" cy="360" r="28" fill="url(#sunCore)"/>
    
    <!-- Horizon light beam -->
    <line x1="48" y1="360" x2="464" y2="360" stroke="url(#horizonLine)" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Lower horizon / deep earth base -->
    <rect x="0" y="360" width="512" height="152" fill="#080c14" opacity="0.85"/>
    <line x1="120" y1="368" x2="392" y2="368" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.3" stroke-linecap="round"/>
    <line x1="180" y1="376" x2="332" y2="376" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.15" stroke-linecap="round"/>
    
    <!-- Border rim -->
    <rect width="512" height="512" rx="112" ry="112" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>
  </g>
</svg>

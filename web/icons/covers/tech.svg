<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="techBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030c17"/>
      <stop offset="50%" stop-color="#08182b"/>
      <stop offset="100%" stop-color="#020810"/>
    </linearGradient>
    <radialGradient id="techGlow" cx="60%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#0369a1" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#techBg)"/>
  <rect width="800" height="450" fill="url(#techGlow)"/>

  <!-- Circuit Trace Grid -->
  <g stroke="#0ea5e9" stroke-width="1.5" stroke-opacity="0.3" fill="none">
    <path d="M 100 200 H 280 L 340 260 H 460 L 520 200 H 700"/>
    <path d="M 140 120 H 260 L 320 180 H 480 L 540 120 H 660"/>
    <path d="M 160 320 H 300 L 360 260 H 440 L 500 320 H 640"/>
    <circle cx="280" cy="200" r="4" fill="#38bdf8"/>
    <circle cx="520" cy="200" r="4" fill="#38bdf8"/>
    <circle cx="260" cy="120" r="4" fill="#38bdf8"/>
    <circle cx="540" cy="120" r="4" fill="#38bdf8"/>
    <circle cx="300" cy="320" r="4" fill="#38bdf8"/>
    <circle cx="500" cy="320" r="4" fill="#38bdf8"/>
  </g>

  <!-- Central Processor Core -->
  <g transform="translate(400, 225)" filter="url(#softShadow)">
    <rect x="-85" y="-85" width="170" height="170" rx="16" fill="url(#chipGrad)" stroke="#38bdf8" stroke-width="2"/>
    <rect x="-65" y="-65" width="130" height="130" rx="10" fill="#091322" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="8 6"/>
    <!-- Die pattern -->
    <rect x="-35" y="-35" width="70" height="70" rx="6" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="16" fill="#38bdf8" fill-opacity="0.8"/>

    <!-- Pins -->
    <g stroke="#0284c7" stroke-width="3" stroke-linecap="round">
      <line x1="-60" y1="-95" x2="-60" y2="-85"/><line x1="-30" y1="-95" x2="-30" y2="-85"/>
      <line x1="0" y1="-95" x2="0" y2="-85"/><line x1="30" y1="-95" x2="30" y2="-85"/><line x1="60" y1="-95" x2="60" y2="-85"/>
      <line x1="-60" y1="85" x2="-60" y2="95"/><line x1="-30" y1="85" x2="-30" y2="95"/>
      <line x1="0" y1="85" x2="0" y2="95"/><line x1="30" y1="85" x2="30" y2="95"/><line x1="60" y1="85" x2="60" y2="95"/>
      <line x1="-95" y1="-60" x2="-85" y2="-60"/><line x1="-95" y1="-30" x2="-85" y2="-30"/>
      <line x1="-95" y1="0" x2="-85" y2="0"/><line x1="-95" y1="30" x2="-85" y2="30"/><line x1="-95" y1="60" x2="-85" y2="60"/>
      <line x1="85" y1="-60" x2="95" y2="-60"/><line x1="85" y1="-30" x2="95" y2="-30"/>
      <line x1="85" y1="0" x2="95" y2="0"/><line x1="85" y1="30" x2="95" y2="30"/><line x1="85" y1="60" x2="95" y2="60"/>
    </g>
  </g>

  <!-- Glass Category Badge -->
  <g transform="translate(36, 36)">
    <rect width="140" height="38" rx="19" fill="url(#pillGrad)" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
    <g transform="translate(16, 11)">
      <rect x="0" y="0" width="16" height="16" rx="3" stroke="#38bdf8" stroke-width="1.8" fill="none"/>
      <circle cx="8" cy="8" r="3" fill="#38bdf8"/>
    </g>
    <text x="44" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#38bdf8">TECH</text>
  </g>

  <!-- Brand Watermark -->
  <g transform="translate(640, 395)" opacity="0.75">
    <circle cx="16" cy="16" r="14" fill="#0c192c" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M 8 18 C 8 13.5 11.5 10 16 10 C 20.5 10 24 13.5 24 18 Z" fill="#38bdf8"/>
    <text x="38" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="0.5">hark <tspan fill="#f59e0b" font-weight="800">DAILY</tspan></text>
  </g>
</svg>

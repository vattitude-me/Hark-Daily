<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="sciBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021317"/>
      <stop offset="50%" stop-color="#06252b"/>
      <stop offset="100%" stop-color="#010c0e"/>
    </linearGradient>
    <radialGradient id="sciGlow" cx="60%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#0f766e" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#sciBg)"/>
  <rect width="800" height="450" fill="url(#sciGlow)"/>

  <!-- Orbital Rings / Cosmic Atom Motif -->
  <g transform="translate(400, 225)" filter="url(#softShadow)">
    <!-- Nucleus Glow -->
    <circle cx="0" cy="0" r="24" fill="#2dd4bf" fill-opacity="0.9"/>
    <circle cx="0" cy="0" r="38" fill="#14b8a6" fill-opacity="0.3"/>

    <!-- Orbital Ring 1 (Horizontal tilt) -->
    <g transform="rotate(30)">
      <ellipse cx="0" cy="0" rx="140" ry="48" stroke="#2dd4bf" stroke-width="2.5" fill="none"/>
      <circle cx="140" cy="0" r="7" fill="#5eead4"/>
    </g>

    <!-- Orbital Ring 2 (Vertical tilt) -->
    <g transform="rotate(-30)">
      <ellipse cx="0" cy="0" rx="140" ry="48" stroke="#14b8a6" stroke-width="2" fill="none"/>
      <circle cx="-140" cy="0" r="7" fill="#5eead4"/>
    </g>

    <!-- Orbital Ring 3 (Steep tilt) -->
    <g transform="rotate(90)">
      <ellipse cx="0" cy="0" rx="140" ry="48" stroke="#0f766e" stroke-width="2" stroke-dasharray="8 6" fill="none"/>
      <circle cx="0" cy="48" r="6" fill="#f59e0b"/>
    </g>

    <!-- Constellation points -->
    <circle cx="-220" cy="-80" r="2" fill="#ffffff" opacity="0.6"/>
    <circle cx="-180" cy="110" r="2.5" fill="#ffffff" opacity="0.7"/>
    <circle cx="210" cy="-100" r="2" fill="#ffffff" opacity="0.6"/>
    <circle cx="240" cy="70" r="3" fill="#ffffff" opacity="0.8"/>
    <line x1="-220" y1="-80" x2="-180" y2="110" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.3"/>
    <line x1="210" y1="-100" x2="240" y2="70" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.3"/>
  </g>

  <!-- Glass Category Badge -->
  <g transform="translate(36, 36)">
    <rect width="160" height="38" rx="19" fill="url(#pillGrad)" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
    <g transform="translate(16, 11)">
      <path d="M 6 0 V 6 L 1 15 A 1 1 0 0 0 2 16 H 14 A 1 1 0 0 0 15 15 L 10 6 V 0" stroke="#2dd4bf" stroke-width="1.8" fill="none"/>
    </g>
    <text x="44" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#2dd4bf">SCIENCE</text>
  </g>

  <!-- Brand Watermark -->
  <g transform="translate(640, 395)" opacity="0.75">
    <circle cx="16" cy="16" r="14" fill="#072b2e" stroke="#2dd4bf" stroke-width="1.5"/>
    <path d="M 8 18 C 8 13.5 11.5 10 16 10 C 20.5 10 24 13.5 24 18 Z" fill="#2dd4bf"/>
    <text x="38" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="0.5">hark <tspan fill="#f59e0b" font-weight="800">DAILY</tspan></text>
  </g>
</svg>

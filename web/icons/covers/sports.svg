<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05140d"/>
      <stop offset="45%" stop-color="#0b2417"/>
      <stop offset="100%" stop-color="#040c08"/>
    </linearGradient>
    <radialGradient id="fieldGlow" cx="65%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#047857" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberGlow" cx="30%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Ball Gradient -->
    <radialGradient id="ballGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="35%" stop-color="#b91c1c"/>
      <stop offset="75%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </radialGradient>
    <radialGradient id="ballSpec" cx="30%" cy="25%" r="30%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#fca5a5" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Bat Wood Gradient -->
    <linearGradient id="batGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="40%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="batEdge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#92400e" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Glass Pill Gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>

    <filter id="glowBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <rect width="800" height="450" fill="url(#fieldGlow)"/>
  <rect width="800" height="450" fill="url(#amberGlow)"/>

  <!-- Stadium Floodlight Arcs / Pitch Curves -->
  <g opacity="0.3" stroke="#10b981" stroke-width="1.5">
    <ellipse cx="400" cy="520" rx="360" ry="180" fill="none"/>
    <ellipse cx="400" cy="520" rx="420" ry="210" fill="none" stroke-dasharray="6 8"/>
    <ellipse cx="400" cy="520" rx="480" ry="240" fill="none"/>
    <path d="M 120 450 L 320 220 L 480 220 L 680 450" stroke="#f59e0b" stroke-opacity="0.35" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Dynamic Motion Trails -->
  <path d="M 220 380 C 340 320 480 260 620 150" stroke="url(#fieldGlow)" stroke-width="6" stroke-linecap="round" opacity="0.8" filter="url(#glowBlur)"/>
  <path d="M 240 390 C 370 330 500 270 630 160" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  <path d="M 270 410 C 400 350 520 290 640 180" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.4"/>

  <!-- Sports Elements: Cricket Bat & Seamed Cricket Ball -->
  <g transform="translate(140, -10)" filter="url(#softShadow)">
    <!-- Cricket Bat (Angled in backdrop) -->
    <g transform="rotate(-38 380 240)">
      <!-- Bat Handle / Grip -->
      <rect x="368" y="50" width="24" height="110" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
      <path d="M 368 75 L 392 75 M 368 95 L 392 95 M 368 115 L 392 115 M 368 135 L 392 135" stroke="#94a3b8" stroke-width="1" opacity="0.6"/>
      <!-- Rubber Grip Cone -->
      <polygon points="364,160 396,160 392,150 368,150" fill="#f59e0b" opacity="0.8"/>
      <!-- Wooden Blade -->
      <path d="M 362 160 C 362 160 358 200 358 350 C 358 375 368 385 380 385 C 392 385 402 375 402 350 C 402 200 398 160 398 160 Z" fill="url(#batGrad)"/>
      <path d="M 362 160 C 362 160 358 200 358 350 C 358 375 368 385 380 385" stroke="url(#batEdge)" stroke-width="3" fill="none"/>
      <!-- Bat Spine/Ridge Highlight -->
      <path d="M 380 180 L 380 375" stroke="#fde68a" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
    </g>

    <!-- Cricket Ball (Prominent Foreground) -->
    <g transform="translate(390, 190)">
      <!-- Ball Shadow -->
      <ellipse cx="0" cy="65" rx="60" ry="16" fill="#000000" opacity="0.55" filter="url(#glowBlur)"/>

      <!-- Ball Sphere -->
      <circle cx="0" cy="0" r="70" fill="url(#ballGrad)"/>
      <circle cx="0" cy="0" r="70" fill="url(#ballSpec)"/>

      <!-- Ball Rim Light -->
      <circle cx="0" cy="0" r="69.5" stroke="#fca5a5" stroke-width="1" opacity="0.4" fill="none"/>

      <!-- Prominent Curved Seam with White/Cream Stitching -->
      <path d="M -49 -49 C -10 -15 15 25 49 49" stroke="#fef3c7" stroke-width="4.5" stroke-linecap="round" fill="none"/>
      <path d="M -50 -50 C -11 -16 14 24 48 48" stroke="#7f1d1d" stroke-width="1.5" stroke-dasharray="2 3" fill="none"/>

      <!-- Chevron Seam Stitches -->
      <g stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" opacity="0.85">
        <line x1="-42" y1="-44" x2="-36" y2="-38"/>
        <line x1="-31" y1="-34" x2="-25" y2="-28"/>
        <line x1="-20" y1="-23" x2="-14" y2="-17"/>
        <line x1="-9" y1="-12" x2="-3" y2="-6"/>
        <line x1="2" y1="-1" x2="8" y2="5"/>
        <line x1="13" y1="10" x2="19" y2="16"/>
        <line x1="24" y1="21" x2="30" y2="27"/>
        <line x1="35" y1="32" x2="41" y2="38"/>
      </g>
    </g>
  </g>

  <!-- Glass Category Badge (Top Left) -->
  <g transform="translate(36, 36)">
    <rect width="210" height="38" rx="19" fill="url(#pillGrad)" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
    <!-- Cricket / Sports Icon -->
    <g transform="translate(16, 10)">
      <circle cx="8" cy="8" r="7" stroke="#10b981" stroke-width="1.8" fill="none"/>
      <path d="M 3 8 C 5 5 11 5 13 8 M 3 8 C 5 11 11 11 13 8" stroke="#10b981" stroke-width="1.2" fill="none"/>
    </g>
    <!-- Label -->
    <text x="44" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#34d399">CRICKET &amp; SPORTS</text>
  </g>

  <!-- Hark Daily Brand Watermark (Bottom Right) -->
  <g transform="translate(640, 395)" opacity="0.75">
    <circle cx="16" cy="16" r="14" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <!-- Small Dawn Sun in Emblem -->
    <path d="M 8 18 C 8 13.5 11.5 10 16 10 C 20.5 10 24 13.5 24 18 Z" fill="#f59e0b"/>
    <text x="38" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="0.5">hark <tspan fill="#f59e0b" font-weight="800">DAILY</tspan></text>
  </g>
</svg>

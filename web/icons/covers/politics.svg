<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="polBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15060b"/>
      <stop offset="50%" stop-color="#240c14"/>
      <stop offset="100%" stop-color="#0a0306"/>
    </linearGradient>
    <radialGradient id="polGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#991b1b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="domeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#polBg)"/>
  <rect width="800" height="450" fill="url(#polGlow)"/>

  <!-- Ray lines from center dome -->
  <g stroke="#f43f5e" stroke-width="1" stroke-opacity="0.15">
    <line x1="400" y1="180" x2="100" y2="80"/>
    <line x1="400" y1="180" x2="200" y2="50"/>
    <line x1="400" y1="180" x2="600" y2="50"/>
    <line x1="400" y1="180" x2="700" y2="80"/>
  </g>

  <!-- Neoclassical Capitol / Parliament Silhouette -->
  <g transform="translate(400, 240)" filter="url(#softShadow)">
    <!-- Base Platform Stairs -->
    <rect x="-180" y="90" width="360" height="12" rx="3" fill="#881337"/>
    <rect x="-160" y="75" width="320" height="15" rx="2" fill="#9f1239"/>
    <rect x="-140" y="60" width="280" height="15" rx="2" fill="#be123c"/>

    <!-- Pillars (Columns) -->
    <g fill="#e11d48" opacity="0.85">
      <rect x="-120" y="-10" width="16" height="70" rx="3"/>
      <rect x="-80" y="-10" width="16" height="70" rx="3"/>
      <rect x="-40" y="-10" width="16" height="70" rx="3"/>
      <rect x="0" y="-10" width="16" height="70" rx="3"/>
      <rect x="24" y="-10" width="16" height="70" rx="3"/>
      <rect x="64" y="-10" width="16" height="70" rx="3"/>
      <rect x="104" y="-10" width="16" height="70" rx="3"/>
    </g>

    <!-- Entablature / Pediment -->
    <rect x="-135" y="-22" width="270" height="12" rx="2" fill="#be123c"/>
    <polygon points="-135,-22 0,-75 135,-22" fill="url(#domeGrad)"/>

    <!-- Central Rotunda & Capitol Dome -->
    <rect x="-55" y="-105" width="110" height="30" rx="4" fill="#9f1239"/>
    <!-- Dome Shell -->
    <path d="M -50 -105 C -50 -160 50 -160 50 -105 Z" fill="url(#domeGrad)"/>
    <!-- Cupola / Lantern -->
    <rect x="-12" y="-180" width="24" height="20" rx="2" fill="#f43f5e"/>
    <line x1="0" y1="-180" x2="0" y2="-195" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Glass Category Badge -->
  <g transform="translate(36, 36)">
    <rect width="165" height="38" rx="19" fill="url(#pillGrad)" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
    <g transform="translate(16, 11)">
      <path d="M 1 14 H 15 M 2 11 L 8 3 L 14 11 H 2 Z" stroke="#fb7185" stroke-width="1.8" fill="none"/>
    </g>
    <text x="44" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#fb7185">POLITICS</text>
  </g>

  <!-- Brand Watermark -->
  <g transform="translate(640, 395)" opacity="0.75">
    <circle cx="16" cy="16" r="14" fill="#200a12" stroke="#fb7185" stroke-width="1.5"/>
    <path d="M 8 18 C 8 13.5 11.5 10 16 10 C 20.5 10 24 13.5 24 18 Z" fill="#fb7185"/>
    <text x="38" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="0.5">hark <tspan fill="#f59e0b" font-weight="800">DAILY</tspan></text>
  </g>
</svg>

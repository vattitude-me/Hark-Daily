<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="mktBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02140d"/>
      <stop offset="50%" stop-color="#062418"/>
      <stop offset="100%" stop-color="#010c08"/>
    </linearGradient>
    <radialGradient id="mktGlow" cx="65%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#059669" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#mktBg)"/>
  <rect width="800" height="450" fill="url(#mktGlow)"/>

  <!-- Horizontal Grid Lines -->
  <g stroke="#10b981" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="4 6">
    <line x1="80" y1="120" x2="720" y2="120"/>
    <line x1="80" y1="190" x2="720" y2="190"/>
    <line x1="80" y1="260" x2="720" y2="260"/>
    <line x1="80" y1="330" x2="720" y2="330"/>
  </g>

  <!-- Candlesticks -->
  <g filter="url(#softShadow)">
    <!-- Candle 1 -->
    <line x1="200" y1="220" x2="200" y2="310" stroke="#10b981" stroke-width="2"/>
    <rect x="190" y="240" width="20" height="50" rx="3" fill="#10b981"/>
    <!-- Candle 2 (dip) -->
    <line x1="260" y1="230" x2="260" y2="320" stroke="#f43f5e" stroke-width="2"/>
    <rect x="250" y="255" width="20" height="40" rx="3" fill="#f43f5e"/>
    <!-- Candle 3 -->
    <line x1="320" y1="180" x2="320" y2="270" stroke="#10b981" stroke-width="2"/>
    <rect x="310" y="200" width="20" height="55" rx="3" fill="#10b981"/>
    <!-- Candle 4 -->
    <line x1="380" y1="150" x2="380" y2="240" stroke="#10b981" stroke-width="2"/>
    <rect x="370" y="165" width="20" height="60" rx="3" fill="#10b981"/>
    <!-- Candle 5 (dip) -->
    <line x1="440" y1="170" x2="440" y2="250" stroke="#f43f5e" stroke-width="2"/>
    <rect x="430" y="185" width="20" height="35" rx="3" fill="#f43f5e"/>
    <!-- Candle 6 -->
    <line x1="500" y1="110" x2="500" y2="210" stroke="#10b981" stroke-width="2"/>
    <rect x="490" y="130" width="20" height="65" rx="3" fill="#10b981"/>
    <!-- Candle 7 -->
    <line x1="560" y1="80" x2="560" y2="180" stroke="#10b981" stroke-width="2"/>
    <rect x="550" y="95" width="20" height="70" rx="3" fill="#10b981"/>
  </g>

  <!-- Continuous Ascent Curve with Gradient Fill -->
  <path d="M 140 330 C 220 310 260 250 320 220 C 380 190 420 210 480 150 C 540 90 600 110 680 70 L 680 380 L 140 380 Z" fill="url(#chartGrad)"/>
  <path d="M 140 330 C 220 310 260 250 320 220 C 380 190 420 210 480 150 C 540 90 600 110 680 70" stroke="#34d399" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <circle cx="680" cy="70" r="6" fill="#34d399"/>
  <circle cx="680" cy="70" r="12" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.5" fill="none"/>

  <!-- Glass Category Badge -->
  <g transform="translate(36, 36)">
    <rect width="165" height="38" rx="19" fill="url(#pillGrad)" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
    <g transform="translate(16, 11)">
      <polyline points="0 14 6 8 10 11 16 3" stroke="#34d399" stroke-width="1.8" fill="none"/>
      <polyline points="11 3 16 3 16 8" stroke="#34d399" stroke-width="1.8" fill="none"/>
    </g>
    <text x="44" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#34d399">MARKETS</text>
  </g>

  <!-- Brand Watermark -->
  <g transform="translate(640, 395)" opacity="0.75">
    <circle cx="16" cy="16" r="14" fill="#041f14" stroke="#34d399" stroke-width="1.5"/>
    <path d="M 8 18 C 8 13.5 11.5 10 16 10 C 20.5 10 24 13.5 24 18 Z" fill="#34d399"/>
    <text x="38" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="0.5">hark <tspan fill="#f59e0b" font-weight="800">DAILY</tspan></text>
  </g>
</svg>

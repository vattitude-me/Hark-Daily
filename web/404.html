<!DOCTYPE html>
<html lang="en-CA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>404 — Story or Page Not Found · Hark Daily</title>
  <meta name="description" content="The story link or page you are looking for has expired or does not exist. Hark Daily stores audio briefings for a rolling window of recent days.">
  <link rel="canonical" href="https://hark.vattitude.ca/404">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="stylesheet" href="/css/styles.css?v=60">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 18%, rgba(245, 158, 11, 0.16) 0%, rgba(14, 138, 138, 0.12) 48%, #16110D 100%);
      color: #FFFFFF;
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 20px;
      box-sizing: border-box;
    }
    .error-container {
      width: 100%;
      max-width: 440px;
      background: rgba(24, 18, 14, 0.94);
      backdrop-filter: blur(36px) saturate(180%);
      -webkit-backdrop-filter: blur(36px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.20);
      border-radius: 28px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
      padding: 34px 26px;
      box-sizing: border-box;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      animation: fadeIn .25s ease;
    }
    .error-logo {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(245, 158, 11, 0.28);
    }
    .error-code {
      font-size: 52px;
      font-weight: 800;
      line-height: 1;
      margin: 2px 0 0;
      background: linear-gradient(180deg, #FFFFFF 30%, #FBBF24 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.02em;
    }
    .error-title {
      font-size: 19px;
      font-weight: 700;
      margin: 0;
      color: #FFFFFF;
    }
    .error-message {
      font-size: 13.5px;
      line-height: 1.55;
      color: rgba(255, 255, 255, 0.74);
      margin: 0;
      max-width: 350px;
    }
    .error-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.30);
      color: #FDE68A;
      font-size: 12px;
      font-weight: 600;
    }
    .error-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      margin-top: 8px;
    }
    .error-btn {
      all: unset;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 48px;
      border-radius: 999px;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: all .18s ease;
    }
    .error-btn.primary {
      background: linear-gradient(180deg, #FBBF24 0%, #F59E0B 100%);
      color: #1F1A14;
      box-shadow: 0 4px 18px rgba(245, 158, 11, 0.35);
    }
    .error-btn.primary:hover {
      transform: scale(1.02);
      box-shadow: 0 6px 22px rgba(245, 158, 11, 0.45);
    }
    .error-btn.ghost {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: rgba(255, 255, 255, 0.90);
    }
    .error-btn.ghost:hover {
      background: rgba(255, 255, 255, 0.16);
      color: #FFFFFF;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="error-container">
    <a href="/" aria-label="Go to Hark Daily Home">
      <img src="/icons/logo-transparent.png" class="error-logo" alt="Hark Daily logo" width="56" height="56">
    </a>
    <div class="error-code">404</div>
    <h1 class="error-title">Page or Story Not Found</h1>
    <div class="error-badge">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <span>Rolling Archive Active</span>
    </div>
    <p class="error-message">
      The story link or page you’re looking for has expired or does not exist. Hark Daily stores audio briefings for a rolling window of recent days.
    </p>
    <div class="error-actions">
      <a href="/" class="error-btn primary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        <span>Listen to Today's Briefing</span>
      </a>
      <a href="/privacy" class="error-btn ghost">Privacy & Data Policy</a>
    </div>
  </div>
</body>
</html>

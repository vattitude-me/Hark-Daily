name: android
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml", "package.json", "package-lock.json", "capacitor.config.json"]
    tags: ["android-v*"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml", "package.json", "package-lock.json", "capacitor.config.json"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor Android
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest

      # A tag like android-v1.0.0 builds a signed APK (to sideload) and app bundle (for Google Play)
      # and attaches both to a GitHub release.
      - name: Signed release APK and bundle
        if: startsWith(github.ref, 'refs/tags/android-v')
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          version="${GITHUB_REF_NAME#android-v}"
          IFS=. read -r major minor patch <<< "${version%%-*}"
          code=$(( major * 10000 + minor * 100 + ${patch:-0} ))
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export ANDROID_KEYSTORE="$RUNNER_TEMP/release.jks"
          ./gradlew --no-daemon assembleRelease bundleRelease -PversionName="$version" -PversionCode="$code"
          aab="app/build/outputs/bundle/release/morning-brief-$version.aab"
          cp app/build/outputs/bundle/release/*.aab "$aab.tmp" && mv "$aab.tmp" "$aab"
          echo "APK=android/app/build/outputs/apk/release/morning-brief-$version.apk" >> "$GITHUB_ENV"
          echo "AAB=android/$aab" >> "$GITHUB_ENV"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/android-v')
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" "$AAB" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK" "$AAB" --title "Android ${GITHUB_REF_NAME#android-v}" \
              --notes "Install the APK on an Android phone (allow installs from this source when asked). The .aab is for Google Play."
          fi
